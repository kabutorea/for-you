<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>for you.</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         ATMOSFER
    ====================================================== -->

    <div
        class="atmosphere"
        aria-hidden="true"
    >

        <div class="atmosphere-light"></div>

        <div class="fog fog-left"></div>

        <div class="fog fog-right"></div>

        <div class="grain"></div>

    </div>


    <!-- =====================================================
         GÜL SAHNESİ
    ====================================================== -->

    <div
        class="rose-scene"
        id="roseScene"
        aria-hidden="true"
    >

        <!-- SOL DAL -->

        <div class="vine vine-left">

            <img
                src="ROSE V3/rose_v3_vine_left.png"
                alt=""
            >

        </div>


        <!-- SAĞ DAL -->

        <div class="vine vine-right">

            <img
                src="ROSE V3/rose_v3_vine_right.png"
                alt=""
            >

        </div>


        <!-- =================================================
             GÜL 1
        ================================================== -->

        <div class="bloom bloom-1">

            <span class="bloom-stem"></span>

            <img
                class="stage stage-closed"
                src="ROSE V3/rose_v3_bud_01_closed.png"
                alt=""
            >

            <img
                class="stage stage-swelling"
                src="ROSE V3/rose_v3_bud_02_swelling.png"
                alt=""
            >

            <img
                class="stage stage-opening"
                src="ROSE V3/rose_v3_bud_03_opening.png"
                alt=""
            >

            <img
                class="stage stage-open"
                src="ROSE V3/rose_v3_flower_01.png"
                alt=""
            >

        </div>


        <!-- =================================================
             GÜL 2
        ================================================== -->

        <div class="bloom bloom-2">

            <span class="bloom-stem"></span>

            <img
                class="stage stage-closed"
                src="ROSE V3/rose_v3_bud_small.png"
                alt=""
            >

            <img
                class="stage stage-swelling"
                src="ROSE V3/rose_v3_bud_02_swelling.png"
                alt=""
            >

            <img
                class="stage stage-opening"
                src="ROSE V3/rose_v3_bud_03_opening.png"
                alt=""
            >

            <img
                class="stage stage-open"
                src="ROSE V3/rose_v3_flower_02.png"
                alt=""
            >

        </div>


        <!-- =================================================
             GÜL 3
        ================================================== -->

        <div class="bloom bloom-3">

            <span class="bloom-stem"></span>

            <img
                class="stage stage-closed"
                src="ROSE V3/rose_v3_bud_medium.png"
                alt=""
            >

            <img
                class="stage stage-swelling"
                src="ROSE V3/rose_v3_bud_02_swelling.png"
                alt=""
            >

            <img
                class="stage stage-opening"
                src="ROSE V3/rose_v3_bud_03_opening.png"
                alt=""
            >

            <img
                class="stage stage-open"
                src="ROSE V3/rose_v3_flower_03.png"
                alt=""
            >

        </div>


        <!-- =================================================
             GÜL 4
        ================================================== -->

        <div class="bloom bloom-4">

            <span class="bloom-stem"></span>

            <img
                class="stage stage-closed"
                src="ROSE V3/rose_v3_bud_side.png"
                alt=""
            >

            <img
                class="stage stage-swelling"
                src="ROSE V3/rose_v3_bud_02_swelling.png"
                alt=""
            >

            <img
                class="stage stage-opening"
                src="ROSE V3/rose_v3_bud_03_opening.png"
                alt=""
            >

            <img
                class="stage stage-open"
                src="ROSE V3/rose_v3_flower_04.png"
                alt=""
            >

        </div>


        <!-- =================================================
             GÜL 5
        ================================================== -->

        <div class="bloom bloom-5">

            <span class="bloom-stem"></span>

            <img
                class="stage stage-closed"
                src="ROSE V3/rose_v3_bud_long.png"
                alt=""
            >

            <img
                class="stage stage-swelling"
                src="ROSE V3/rose_v3_bud_02_swelling.png"
                alt=""
            >

            <img
                class="stage stage-opening"
                src="ROSE V3/rose_v3_bud_03_opening.png"
                alt=""
            >

            <img
                class="stage stage-open"
                src="ROSE V3/rose_v3_flower_01.png"
                alt=""
            >

        </div>


        <!-- =================================================
             GÜL 6
        ================================================== -->

        <div class="bloom bloom-6">

            <span class="bloom-stem"></span>

            <img
                class="stage stage-closed"
                src="ROSE V3/rose_v3_bud_small.png"
                alt=""
            >

            <img
                class="stage stage-swelling"
                src="ROSE V3/rose_v3_bud_02_swelling.png"
                alt=""
            >

            <img
                class="stage stage-opening"
                src="ROSE V3/rose_v3_bud_03_opening.png"
                alt=""
            >

            <img
                class="stage stage-open"
                src="ROSE V3/rose_v3_flower_04.png"
                alt=""
            >

        </div>

    </div>


    <!-- =====================================================
         ANA SAYFA
    ====================================================== -->

    <main
        class="screen home-screen active"
        id="homeScreen"
    >

        <div class="screen-content">

            <div class="date">
                28.09.2026
            </div>

            <h1>
                for you.
            </h1>

            <p class="subtitle">
                some things are meant to stay between us.
            </p>

            <button
                class="enter-button"
                id="enterButton"
            >
                enter
            </button>

        </div>

    </main>


    <!-- =====================================================
         ŞİFRE
    ====================================================== -->

    <main
        class="screen password-screen"
        id="passwordScreen"
    >

        <div class="screen-content password-content">

            <p class="eyebrow">
                private archive
            </p>

            <h2>
                private.
            </h2>

            <p class="password-description">
                this place is only for you.
            </p>

            <input
                type="password"
                id="passwordInput"
                placeholder="password"
                autocomplete="off"
            >

            <button
                class="password-button"
                id="passwordButton"
            >
                enter
            </button>

            <p
                class="password-error"
                id="passwordError"
            >
                wrong password.
            </p>

        </div>

    </main>


    <!-- =====================================================
         LETTER ARCHIVE
    ====================================================== -->

    <main
        class="archive"
        id="archiveScreen"
    >

        <header class="archive-header">

            <p class="eyebrow">
                a little place for you
            </p>

            <h2>
                letters.
            </h2>

            <p class="archive-intro">
                things i wanted you to know.
            </p>

        </header>

        <div id="lettersContainer"></div>

    </main>


    <!-- =====================================================
         LETTER OVERLAY
    ====================================================== -->

    <div
        class="letter-overlay"
        id="letterOverlay"
        aria-hidden="true"
    >

        <div
            class="letter-overlay-backdrop"
            id="letterOverlayBackdrop"
        ></div>


        <!-- =================================================
             ZARF SAHNESİ
        ================================================== -->

        <div
            class="envelope-scene"
            id="envelopeScene"
        >

            <img
                id="closedEnvelopeImage"
                class="overlay-envelope closed"
                src="envelope-vintage-cutout.png"
                alt=""
            >

            <img
                id="openEnvelopeImage"
                class="overlay-envelope open"
                src="envelope-open-cutout.png"
                alt=""
            >

            <img
                id="brokenSeal"
                class="overlay-seal"
                src="wax-seal-broken.png"
                alt=""
            >

        </div>


        <!-- =================================================
             UZAYAN MEKTUP KÂĞIDI
        ================================================== -->

        <div
            class="letter-paper"
            id="letterPaper"
        >

            <div
                class="letter-paper-background"
                aria-hidden="true"
            >

                <div class="paper-texture-top"></div>

                <div class="paper-texture-middle"></div>

                <div class="paper-texture-bottom"></div>

            </div>


            <div class="letter-content">

                <div
                    class="letter-open-date"
                    id="letterOpenDate"
                ></div>

                <h2
                    class="letter-open-title"
                    id="letterOpenTitle"
                ></h2>

                <div class="letter-open-line"></div>

                <div
                    class="letter-open-text"
                    id="letterOpenText"
                ></div>

            </div>

        </div>


        <!-- =================================================
             KAPAT
        ================================================== -->

        <button
            class="letter-close-button"
            id="letterCloseButton"
            aria-label="Close letter"
        >
            ×
        </button>

    </div>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>

</html>
